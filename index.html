<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Underneath</title>
    <!-- サイトアイコン設定 -->
    <link rel="icon" href="data/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 実績獲得通知バナー表示エリア（画面右上） -->
    <div id="achievement-toast-container"></div>

    <!-- ヘッダー / デバッグ領域 -->
    <header>
        <h1>Underneath</h1>
    </header>

<!-- 1. ホーム画面 -->
<section id="view-home" class="view">
    <h2>パズルセット一覧</h2>
    <div id="set-list" class="set-grid"></div>

    <!-- ホーム画面下部ボタンエリア -->
    <div class="home-footer">
        <button onclick="openAchievementsModal()" class="button">実績</button>
        <button onclick="resetProgress()" class="button-danger">全進捗をリセット</button>
    </div>
</section>

<!-- 2. セットホーム画面 -->
    <section id="view-set" class="view hidden">
        <div class="set-header-container">
            <button onclick="backToHomeView()" class="btn-back-home" aria-label="全体ホームに戻る">←</button>
            <div id="set-header">
                <div class="set-info">
                    <h2 id="set-title"></h2>
                    <p id="set-description"></p>
                    <div class="set-actions">
                        <a id="link-pdf-download" href="#" download class="button">PDFをダウンロード</a>
                    </div>
                </div>
                <img id="set-icon" src="" alt="icon">
            </div>
        </div>
        <hr>
        <h3>問題一覧</h3>
        <div id="puzzle-list" class="button-grid"></div>
    </section>

<!-- 3. 問題プレイ画面 -->
    <section id="view-puzzle" class="view hidden">
        <div class="puzzle-nav">
            <button onclick="backToSetView()">← セット画面に戻る</button>
            <span id="puzzle-title"></span>
            <a id="btn-external-penpa" href="#" target="_blank" rel="noopener noreferrer" class="button button-external">Penpa-editorで解く ↗</a>
        </div>
        
        <div class="puzzle-main-container">
            <button id="btn-prev-puzzle" onclick="navigatePuzzle(-1)" class="puzzle-side-btn">＜</button>
            <div class="iframe-container">
                <iframe id="penpa-frame" src="about:blank"></iframe>
            </div>
            <button id="btn-next-puzzle" onclick="navigatePuzzle(1)" class="puzzle-side-btn">＞</button>
        </div>
    </section>

    <!-- 実績確認モーダル -->
    <div id="modal-achievements" class="modal-overlay hidden" onclick="closeAchievementsModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>実績一覧</h2>
                <button onclick="closeAchievementsModal()" class="btn-close">&times;</button>
            </div>
            <div id="achievement-list" class="achievement-grid"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
